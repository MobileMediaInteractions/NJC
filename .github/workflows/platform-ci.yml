name: Platform and application CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm platform:check
      - run: pnpm platform:conformance
      - run: pnpm platform:demo
        env: { PLATFORM_DEV_LICENSE_MODE: "true" }
      - run: pnpm platform:benchmark
      - name: C ABI smoke build
        run: clang++ -std=c++17 -Wall -Wextra -Werror -I platform/sdks/c-abi/include platform/sdks/c-abi/src/platform_runtime.cpp platform/sdks/c-abi/tests/smoke.cpp -o /tmp/platform-runtime-smoke && /tmp/platform-runtime-smoke
      - name: Audit high-severity dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2; do
            output="$(timeout --kill-after=5s 60s pnpm audit --audit-level high 2>&1)"
            status=$?
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && ! grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" <<<"$output"; then
              exit "$status"
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "npm audit transport was unavailable; retrying ($attempt/2)."
              sleep 5
            fi
          done

          echo "::warning::The npm audit transport remained unavailable after two bounded attempts. Dependency advisories were not suppressed; no audit result was available from the registry."

  applications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics_test
          POSTGRES_PASSWORD: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics_test -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANALYTICS_TEST_DATABASE_URL: postgres://analytics_test:analytics_test@127.0.0.1:5432/analytics_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - name: Install Roku validation prerequisites
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
      - run: pnpm playground:check
      - run: pnpm employee:check
      - run: pnpm internal:check
      - run: pnpm internal:audit
      - run: pnpm mobile:check
      - run: pnpm tv:check
      - run: pnpm roku:check
      - name: Migration freshness
        run: pnpm db:generate && git diff --exit-code -- apps/web/drizzle packages/backend/src/db/schema.ts

  studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm studio:check

  visual-feature-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir visual-feature-platform install --frozen-lockfile
      - run: pnpm --dir visual-feature-platform check
      - run: pnpm --dir tools/studio test
      - run: pnpm --dir tools/studio typecheck
      - run: pnpm --dir tools/studio lint
